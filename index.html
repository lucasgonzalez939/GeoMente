<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoMind - Virtual Geoboard</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --board-color: #d7ccc8;
            --pin-color: #37474f;
            --rubberband-color: #ff4081;
            --text-color: #263238;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            max-width: 1000px;
            width: 100%;
            margin-top: 20px;
        }

        @media (max-width: 800px) {
            .container { flex-direction: column; align-items: center; }
        }

        .workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        #geoboard {
            background-color: var(--board-color);
            border-radius: 8px;
            cursor: crosshair;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.15);
        }

        .pin {
            fill: var(--pin-color);
            transition: fill 0.2s;
        }
        .pin:hover {
            fill: #ff9100;
            r: 8px;
        }

        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .stats-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .stat-box {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .btn {
            background: #2979ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background: #2962ff; }
        .btn-danger { background: #ff1744; }
        .btn-danger:hover { background: #d50000; }

        .challenge-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
        }
        .status-incomplete { background: #ffe082; color: #81c784; color: #b78103; }
        .status-complete { background: #c8e6c9; color: #2e7d32; }
    </style>
</head>
<body>

    <h1>GeoMind: Interactive Geoboard</h1>

    <div class="container">
        <div class="workspace">
            <svg id="geoboard" width="450" height="450"></svg>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button class="btn btn-danger" onclick="clearBoard()">Reset Board</button>
            </div>
        </div>

        <div class="sidebar">
            <div class="card">
                <h2>Live Analytics</h2>
                <div class="stats-display">
                    <div class="stat-box">
                        <div style="font-size: 0.9rem; color: #666;">Area</div>
                        <span id="area-val">0</span> u²
                    </div>
                    <div class="stat-box">
                        <div style="font-size: 0.9rem; color: #666;">Perimeter</div>
                        <span id="perimeter-val">0</span> u
                    </div>
                </div>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>Mission Control</h2>
                    <span id="challenge-status" class="status-badge status-incomplete">Active</span>
                </div>
                <h3 id="challenge-title">Loading...</h3>
                <p id="challenge-desc">Loading...</p>
                <div class="challenge-nav">
                    <button class="btn" onclick="prevChallenge()">◀ Prev</button>
                    <span id="challenge-index" style="font-weight: bold;">1/3</span>
                    <button class="btn" onclick="nextChallenge()">Next ▶</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION & STATE
        const GRID_SIZE = 8;       // 8x8 pins
        const PIN_SPACING = 50;   // Pixels between pins
        const MARGIN = 50;         // SVG padding
        
        let pathPoints = [];       // Array of {x, y} grid positions selected
        let isClosed = false;
        let currentChallengeIdx = 0;

        const challenges = [
            {
                title: "The Initial Target",
                desc: "Your first challenge from class! Create any shape that has an area of exactly **14 square units**.",
                validate: (area, perimeter, points) => Math.abs(area - 14) < 0.01
            },
            {
                title: "The Triangle Splitter",
                desc: "Build a shape with an area of exactly **3 square units**. Try to use diagonal cuts to achieve this!",
                validate: (area, perimeter, points) => Math.abs(area - 3) < 0.01
            },
            {
                title: "The Fence Matrix",
                desc: "Create a closed shape that has a perimeter of exactly **12 units**. See what variations you can build.",
                validate: (area, perimeter, points) => Math.abs(perimeter - 12) < 0.05
            }
        ];

        // INITIALIZATION
        const svg = document.getElementById('geoboard');
        
        function initBoard() {
            svg.innerHTML = ''; // Clear previous elements
            
            // Create dynamic interactive rubberband path
            const rubberband = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            rubberband.setAttribute("id", "rubberband");
            rubberband.setAttribute("fill", "rgba(255, 64, 129, 0.25)");
            rubberband.setAttribute("stroke", "var(--rubberband-color)");
            rubberband.setAttribute("stroke-width", "4");
            rubberband.setAttribute("stroke-linejoin", "round");
            svg.appendChild(rubberband);

            // Render physical pins grid
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    const cx = MARGIN + x * PIN_SPACING;
                    const cy = MARGIN + y * PIN_SPACING;
                    
                    circle.setAttribute("cx", cx);
                    circle.setAttribute("cy", cy);
                    circle.setAttribute("r", "5");
                    circle.setAttribute("class", "pin");
                    // Store internal discrete coordinate metadata inside the node
                    circle.dataset.gridX = x;
                    circle.dataset.gridY = y;
                    
                    circle.addEventListener('click', onPinClick);
                    svg.appendChild(circle);
                }
            }
            updateChallengeUI();
        }

        // EVENT HANDLERS
        function onPinClick(e) {
            const gx = parseInt(e.target.dataset.gridX);
            const gy = parseInt(e.target.dataset.gridY);

            if (isClosed) return; // Reset required to build a new configuration

            // If clicking the origin pin, close the shape
            if (pathPoints.length > 2 && pathPoints[0].x === gx && pathPoints[0].y === gy) {
                isClosed = true;
                calculateMetrics();
                return;
            }

            // Prevent duplicate adjacent selections
            if (pathPoints.some(p => p.x === gx && p.y === gy)) return;

            pathPoints.push({ x: gx, y: gy });
            renderRubberband();
            calculateMetrics();
        }

        function renderRubberband() {
            const polygon = document.getElementById('rubberband');
            const pointsString = pathPoints.map(p => {
                const screenX = MARGIN + p.x * PIN_SPACING;
                const screenY = MARGIN + p.y * PIN_SPACING;
                return `${screenX},${screenY}`;
            }).join(' ');
            
            polygon.setAttribute("points", pointsString);
        }

        // GEOMETRIC MATHEMATICS ENGINE
        function calculateMetrics() {
            if (pathPoints.length < 3) {
                document.getElementById('area-val').innerText = "0";
                document.getElementById('perimeter-val').innerText = "0";
                return;
            }

            // 1. Perimeter Engine (Euclidean Matrix Accumulation)
            let perimeter = 0;
            for (let i = 0; i < pathPoints.length; i++) {
                const p1 = pathPoints[i];
                // Connect back to start if closed, otherwise read up to array length
                const p2 = pathPoints[(i + 1) % pathPoints.length];
                
                if (isClosed || i < pathPoints.length - 1) {
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    perimeter += Math.sqrt(dx * dx + dy * dy);
                }
            }

            // 2. Area Engine (Gauss's Shoelace Algorithm)
            let area = 0;
            if (isClosed) {
                let j = pathPoints.length - 1;
                for (let i = 0; i < pathPoints.length; i++) {
                    area += (pathPoints[j].x + pathPoints[i].x) * (pathPoints[j].y - pathPoints[i].y);
                    j = i;
                }
                area = Math.abs(area / 2);
            }

            // Update DOM Calculations
            document.getElementById('area-val').innerText = area.toFixed(1);
            document.getElementById('perimeter-val').innerText = perimeter.toFixed(2);

            checkChallengeConstraints(area, perimeter);
        }

        // GAMIFICATION / CHALLENGE ENGINE
        function checkChallengeConstraints(area, perimeter) {
            const current = challenges[currentChallengeIdx];
            const badge = document.getElementById('challenge-status');
            
            if (isClosed && current.validate(area, perimeter, pathPoints)) {
                badge.innerText = "SUCCESS!";
                badge.className = "status-badge status-complete";
            } else {
                badge.innerText = isClosed ? "Try Again" : "Drawing...";
                badge.className = "status-badge status-incomplete";
            }
        }

        function updateChallengeUI() {
            const current = challenges[currentChallengeIdx];
            document.getElementById('challenge-title').innerText = current.title;
            document.getElementById('challenge-desc').innerText = current.desc;
            document.getElementById('challenge-index').innerText = `${currentChallengeIdx + 1} / ${challenges.length}`;
            
            // Re-validate instantly on transition
            calculateMetrics();
        }

        function nextChallenge() {
            if (currentChallengeIdx < challenges.length - 1) {
                currentChallengeIdx++;
                updateChallengeUI();
            }
        }

        function prevChallenge() {
            if (currentChallengeIdx > 0) {
                currentChallengeIdx--;
                updateChallengeUI();
            }
        }

        function clearBoard() {
            pathPoints = [];
            isClosed = false;
            renderRubberband();
            calculateMetrics();
        }

        // Fire up DOM context configuration execution on load
        window.onload = initBoard;
    </script>
</body>
</html>
